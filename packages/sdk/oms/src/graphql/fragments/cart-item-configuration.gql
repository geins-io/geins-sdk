#import "./configuration-committed.gql"

fragment OmsCartItemConfiguration on CartType {
  items {
    configurationId
    configuration {
      committedConfigurationId
      articleNumber
      discountPercent
      weightPerUnit
      summary {
        label
        value
        __typename
      }
      ...CpqCommittedSections
      __typename
    }
    __typename
  }
}
