#import "./configuration-committed.gql"

fragment CpqConfiguredCartLines on CartType {
  id
  items {
    id
    quantity
    configurationId
    configuration {
      committedConfigurationId
      articleNumber
      discountPercent
      weightPerUnit
      summary {
        label
        value
      }
      ...CpqCommittedSections
    }
  }
}
