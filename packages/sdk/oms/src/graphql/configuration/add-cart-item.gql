#import "../fragments/configured-cart-lines.gql"
mutation addConfiguredCartItem($id: String!, $item: CartItemInputType!, $channelId: String, $languageId: String, $marketId: String) {
  addToCart(id: $id, item: $item, channelId: $channelId, languageId: $languageId, marketId: $marketId) {
    ...CpqConfiguredCartLines
  }
}
