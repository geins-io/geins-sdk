#import "../fragments/configuration-committed.gql"
# Rows match the order service's by position: an order row's id is the nil GUID.
query getConfiguredOrderLines(
  $publicOrderId: Guid!
  $channelId: String
  $languageId: String
  $marketId: String
) {
  getOrderPublic(
    publicOrderId: $publicOrderId
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    cart {
      items {
        product {
          productId
          type
        }
        configuration {
          summary {
            label
            value
          }
          ...CpqCommittedSections
        }
      }
    }
  }
}
