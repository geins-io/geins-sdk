#import "../fragments/cart.gql"
#import "../fragments/cart-item-configuration.gql"
mutation setCartMerchantData(
  $id: String!
  $merchantData: String!
  $channelId: String
  $languageId: String
  $marketId: String
) {
  setCartMerchantData(
    id: $id
    merchantData: $merchantData
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    ...OmsCart
    ...OmsCartItemConfiguration
    __typename
  }
}
