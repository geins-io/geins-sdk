#import "../fragments/cart.gql"
#import "../fragments/cart-item-configuration.gql"
query getCart(
  $id: String
  $forceRefresh: Boolean
  $channelId: String
  $languageId: String
  $marketId: String
) {
  getCart(
    id: $id
    forceRefresh: $forceRefresh
    includeCompleted: true
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    ...OmsCart
    ...OmsCartItemConfiguration
    __typename
  }
}
