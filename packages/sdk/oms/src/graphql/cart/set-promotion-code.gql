#import "../fragments/cart.gql"
#import "../fragments/cart-item-configuration.gql"
mutation setCartPromoCode(
  $id: String!
  $promoCode: String!
  $channelId: String
  $languageId: String
  $marketId: String
) {
  setCartPromoCode(
    id: $id
    promoCode: $promoCode
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    ...OmsCart
    ...OmsCartItemConfiguration
    __typename
  }
}
