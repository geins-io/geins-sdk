  addressLine1: String
  addressLine2: String
  addressLine3: String
  entryCode: String
  careOf: String
  city: String
  state: String
  country: String
  zip: String
  company: String
  mobile: String
  phone: String
}

type AddressType {
  """The first name of the address holder."""
  firstName: String!

  """The last name of the address holder."""
  lastName: String!

  """The first line of the address."""
